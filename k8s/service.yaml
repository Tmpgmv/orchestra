apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  labels:
    app: sentiment-app     # Эта метек нужна для service monitor.
spec:
  type: LoadBalancer
  selector:
    app: sentiment-app     # Эта метка для выбора подов.
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP